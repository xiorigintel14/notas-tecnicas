<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Inventario ORICUE-10</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      padding-bottom: 100px;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #121212;
      color: #ffffff;
    }


    .contenedor {
      width: 100%;
      max-width: 700px;
      margin: auto;
    }


    /* ==================================================
       TITULO
    ================================================== */

    .titulo {
      text-align: center;
      margin-bottom: 18px;
    }


    .titulo h1 {
      margin: 0;

      color: #4caf50;

      font-size: 25px;
    }


    .titulo p {
      margin-top: 5px;

      color: #999;

      font-size: 13px;
    }


    /* ==================================================
       CONEXION
    ================================================== */

    .conexion {
      margin-top: 8px;

      font-size: 11px;

      font-weight: bold;
    }


    .conexion-online {
      color: #69f0ae;
    }


    .conexion-offline {
      color: #ffab91;
    }


    /* ==================================================
       PENDIENTES OFFLINE
    ================================================== */

    .pendientes-offline {
      display: none;

      margin-top: 10px;

      padding: 9px;

      border-radius: 8px;

      background: #6d4c41;

      color: #ffe082;

      font-size: 12px;

      font-weight: bold;
    }


    /* ==================================================
       MENU
    ================================================== */

    .menu {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 8px;

      margin-bottom: 15px;
    }


    .menu button {
      padding: 13px 5px;

      border-radius: 10px;

      border: 1px solid #444;

      background: #252525;

      color: white;

      font-size: 12px;

      font-weight: bold;

      cursor: pointer;
    }


    .menu button.activo {
      background: #4caf50;

      border-color: #4caf50;
    }


    /* ==================================================
       SECCIONES
    ================================================== */

    .seccion {
      display: none;
    }


    .seccion.activa {
      display: block;
    }


    /* ==================================================
       TARJETAS GENERALES
    ================================================== */

    .tarjeta {
      background: #1e1e1e;

      border-radius: 12px;

      padding: 16px;

      margin-bottom: 12px;

      border: 1px solid #303030;
    }


    /* ==================================================
       FORMULARIO
    ================================================== */

    .tipo-actual {
      text-align: center;

      padding: 11px;

      border-radius: 8px;

      background: #292929;

      margin-bottom: 15px;

      font-weight: bold;

      color: #ddd;
    }


    label {
      display: block;

      margin-top: 14px;

      margin-bottom: 6px;

      color: #ccc;

      font-size: 13px;

      font-weight: bold;
    }


    select,
    input,
    textarea {

      width: 100%;

      padding: 13px;

      border-radius: 8px;

      border: 1px solid #444;

      background: #292929;

      color: white;

      font-size: 16px;
    }


    select:focus,
    input:focus,
    textarea:focus {

      outline: none;

      border-color: #4caf50;
    }


    textarea {
      min-height: 90px;

      resize: vertical;
    }


    .btn-principal {
      width: 100%;

      margin-top: 18px;

      padding: 15px;

      border: none;

      border-radius: 10px;

      background: #4caf50;

      color: white;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;
    }


    .btn-principal:disabled {
      background: #555;

      cursor: not-allowed;
    }


    /* ==================================================
       BARRA SUPERIOR
    ================================================== */

    .barra-superior {
      display: flex;

      gap: 8px;

      margin-bottom: 12px;
    }


    .barra-superior input {
      flex: 1;
    }


    .btn-recargar {
      width: 50px;

      flex-shrink: 0;

      border: none;

      border-radius: 8px;

      background: #333;

      color: white;

      font-size: 20px;

      cursor: pointer;
    }


    /* ==================================================
       RESUMEN
    ================================================== */

    .resumen {
      display: grid;

      grid-template-columns:
        1fr 1fr 1fr;

      gap: 7px;

      margin-bottom: 12px;
    }


    .resumen-card {
      background: #1e1e1e;

      border-radius: 10px;

      text-align: center;

      padding: 10px 3px;

      border: 1px solid #303030;
    }


    .resumen-numero {
      font-size: 21px;

      font-weight: bold;

      color: #03dac6;
    }


    .resumen-texto {
      font-size: 9px;

      margin-top: 4px;

      color: #999;
    }


    /* ==================================================
       INVENTARIO
    ================================================== */

    .material-card {
      background: #1e1e1e;

      border-radius: 12px;

      margin-bottom: 10px;

      padding: 14px;

      border: 1px solid #303030;
    }


    .material-cabecera {
      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 10px;

      margin-bottom: 10px;
    }


    .material-nombre {
      font-size: 16px;

      font-weight: bold;
    }


    .estado-stock {
      white-space: nowrap;

      padding: 5px 8px;

      border-radius: 20px;

      font-size: 10px;

      font-weight: bold;
    }


    .estado-disponible {
      background: #1b5e20;

      color: #b9f6ca;
    }


    .estado-bajo {
      background: #795548;

      color: #ffe082;
    }


    .estado-agotado {
      background: #7f0000;

      color: #ffcdd2;
    }


    .stock-numero {
      text-align: center;

      font-size: 30px;

      font-weight: bold;

      color: #03dac6;

      margin: 6px 0;
    }


    .stock-texto {
      text-align: center;

      font-size: 11px;

      color: #999;

      margin-bottom: 10px;
    }


    .detalle-stock {
      display: grid;

      grid-template-columns:
        1fr 1fr 1fr;

      gap: 6px;
    }


    .detalle-item {
      text-align: center;

      background: #292929;

      padding: 8px 3px;

      border-radius: 7px;

      font-size: 10px;

      color: #aaa;
    }


    .detalle-item strong {
      display: block;

      margin-top: 3px;

      color: white;

      font-size: 13px;
    }


    /* ==================================================
       PEDIDOS
    ================================================== */

    .pedido-card {
      background: #1e1e1e;

      border-radius: 12px;

      margin-bottom: 11px;

      padding: 14px;

      border: 1px solid #303030;
    }


    .pedido-cabecera {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

      margin-bottom: 10px;
    }


    .pedido-material {
      font-size: 16px;

      font-weight: bold;
    }


    .pedido-estado {
      padding: 5px 8px;

      border-radius: 20px;

      font-size: 10px;

      font-weight: bold;

      white-space: nowrap;
    }


    .pedido-pendiente {
      background: #6d4c41;

      color: #ffe082;
    }


    .pedido-parcial {
      background: #0d47a1;

      color: #bbdefb;
    }


    .pedido-recibido {
      background: #1b5e20;

      color: #b9f6ca;
    }


    .pedido-detalle {
      display: grid;

      grid-template-columns:
        1fr 1fr 1fr;

      gap: 6px;

      margin-bottom: 10px;
    }


    .pedido-numero {
      background: #292929;

      border-radius: 8px;

      padding: 8px 4px;

      text-align: center;

      font-size: 10px;

      color: #aaa;
    }


    .pedido-numero strong {
      display: block;

      color: white;

      font-size: 15px;

      margin-top: 3px;
    }


    .pedido-info {
      font-size: 10px;

      color: #999;

      line-height: 1.5;

      margin-bottom: 10px;
    }


    .zona-recibir {
      display: grid;

      grid-template-columns:
        1fr auto;

      gap: 7px;
    }


    .zona-recibir input {
      min-width: 0;
    }


    .btn-recibir {
      border: none;

      border-radius: 8px;

      padding: 8px 13px;

      background: #4caf50;

      color: white;

      font-weight: bold;

      cursor: pointer;
    }


    .btn-recibir:disabled {
      background: #555;
    }


    .pedido-completo {
      text-align: center;

      padding: 8px;

      border-radius: 8px;

      background: #153b18;

      color: #8ff29a;

      font-size: 11px;

      font-weight: bold;
    }


    /* ==================================================
       MOVIMIENTOS
    ================================================== */

    .movimiento {
      background: #1e1e1e;

      border-radius: 10px;

      padding: 12px;

      margin-bottom: 8px;

      border: 1px solid #303030;
    }


    .movimiento-top {
      display: flex;

      justify-content: space-between;

      gap: 10px;

      margin-bottom: 6px;
    }


    .movimiento-material {
      font-weight: bold;

      font-size: 14px;
    }


    .movimiento-cantidad {
      font-size: 16px;

      font-weight: bold;
    }


    .entrada {
      color: #69f0ae;
    }


    .salida {
      color: #ff8a80;
    }


    .movimiento-info {
      font-size: 10px;

      color: #999;

      line-height: 1.5;
    }


    /* ==================================================
       ESTADOS FORMULARIO
    ================================================== */

    .estado {
      display: none;

      margin-top: 15px;

      padding: 12px;

      border-radius: 8px;

      text-align: center;

      font-weight: bold;

      font-size: 13px;
    }


    .correcto {
      background: #1b5e20;
    }


    .error {
      background: #b71c1c;
    }


    .cargando {
      background: #424242;
    }


    .mensaje-centro {
      text-align: center;

      padding: 30px 10px;

      color: #888;
    }


    /* ==================================================
       PIE
    ================================================== */

    .pie {
      text-align: center;

      color: #555;

      font-size: 10px;

      margin-top: 20px;
    }


    @media (max-width: 420px) {

      body {
        padding: 10px;

        padding-bottom: 100px;
      }


      .titulo h1 {
        font-size: 22px;
      }


      .material-nombre,
      .pedido-material {
        font-size: 14px;
      }

    }

  </style>

</head>


<body>


<div class="contenedor">


  <!-- =================================================
       TITULO
  ================================================== -->

  <div class="titulo">

    <h1>
      📦 INVENTARIO ORICUE-10
    </h1>

    <p>

    </p>


    <div

  <!-- =================================================

  >

        <div
          id="pedidosPendientes"

       MOVIMIENTOS
  ================================================== -->

    class="seccion"

        type="text"
        id="buscarMovimiento"
        placeholder="🔎 Buscar movimiento..."
        oninput="filtrarMovimientos()"
      >


      <button
        class="btn-recargar"
        onclick="cargarMovimientos()"

        🔄
      </button>

<script>


// =====================================================
// URL APPS SCRIPT
// =====================================================

const INVENTARIO_URL =
  "https://script.google.com/macros/s/AKfycbxIKlHure5mzwgRrBDAHSKS69_1kd_mLpaKYwirYQ7Y8cJvJECje5b24H6I3SKZuYe0/exec";



// =====================================================
// VARIABLES
// =====================================================

let tipoActual =
  "PEDIDO";


let inventarioDatos =
  [];


let movimientosDatos =
  [];


let pedidosDatos =
  [];



// =====================================================
// ESTADO DE CONEXION
// =====================================================

function actualizarEstadoConexion() {

  const elemento =
    document.getElementById(
      "estadoConexion"
    );


  if (navigator.onLine) {

    elemento.textContent =
      "🟢 EN LÍNEA";


    elemento.className =
      "conexion conexion-online";

  }

  else {

    elemento.textContent =
      "📴 SIN INTERNET";


    elemento.className =
      "conexion conexion-offline";

  }

}



// =====================================================
// ID OPERACION
// =====================================================

function generarIdOperacion() {

  return (
    "APP-" +
    Date.now() +
    "-" +
    Math.floor(
      Math.random() * 100000
    )
  );

}



// =====================================================
// PENDIENTES OFFLINE
// =====================================================

function obtenerPendientes() {

  try {

    return JSON.parse(
      localStorage.getItem(
        "inventario_pendientes"
      ) || "[]"
    );

  }

  catch (error) {

    return [];

  }

}



function guardarPendiente(
  datos
) {

  const pendientes =
    obtenerPendientes();


  const existe =
    pendientes.some(
      function(item) {

        return (
          item.idOperacion ===
          datos.idOperacion
        );

      }
    );


  if (!existe) {

    pendientes.push(
      datos
    );

  }


  localStorage.setItem(
    "inventario_pendientes",
    JSON.stringify(
      pendientes
    )
  );


  actualizarIndicadorPendientes();

}



function actualizarIndicadorPendientes() {

  const pendientes =
    obtenerPendientes();


  const indicador =
    document.getElementById(
      "indicadorPendientes"
    );


  if (
    pendientes.length === 0
  ) {

    indicador.style.display =
      "none";


    indicador.textContent =
      "";

  }

  else {

    indicador.style.display =
      "block";


    indicador.textContent =
      "📴 " +
      pendientes.length +
      " operación(es) pendiente(s) de sincronizar";

  }

}



// =====================================================
// SINCRONIZAR PENDIENTES
// =====================================================

async function sincronizarPendientes() {

  if (
    !navigator.onLine
  ) {

    return;

  }


  const pendientes =
    obtenerPendientes();


  if (
    pendientes.length === 0
  ) {

    actualizarIndicadorPendientes();

    return;

  }


  const restantes =
    [];


  for (
    const datos of pendientes
  ) {

    try {

      await fetch(
        INVENTARIO_URL,
        {

          method:
            "POST",

          mode:
            "no-cors",

          body:
            JSON.stringify(
              datos
            )

        }
      );


      await esperar(
        350
      );


    }

    catch (error) {

      console.error(
        error
      );


      restantes.push(
        datos
      );

    }

  }


  localStorage.setItem(
    "inventario_pendientes",
    JSON.stringify(
      restantes
    )
  );


  actualizarIndicadorPendientes();


  if (
    restantes.length === 0
  ) {

    await esperar(
      1200
    );


    cargarInventario();

    cargarMovimientos();

    cargarPedidos();

  }

}



// =====================================================
// ESPERAR
// =====================================================

function esperar(
  milisegundos
) {

  return new Promise(
    function(resolve) {

      setTimeout(
        resolve,
        milisegundos
      );

    }
  );

}



// =====================================================
// CAMBIAR SECCION
// =====================================================

function mostrarSeccion(
  tipo
) {

  document
    .querySelectorAll(
      ".seccion"
    )
    .forEach(
      function(seccion) {

        seccion.classList.remove(
          "activa"
        );

      }
    );


  document
    .querySelectorAll(
      ".menu button"
    )
    .forEach(
      function(boton) {

        boton.classList.remove(
          "activo"
        );

      }
    );


  // ==========================================
  // INVENTARIO
  // ==========================================

  if (
    tipo === "INVENTARIO"
  ) {

    document
      .getElementById(
        "seccionInventario"
      )
      .classList.add(
        "activa"
      );


    document
      .getElementById(
        "menuInventario"
      )
      .classList.add(
        "activo"
      );


    cargarInventario();

    return;

  }


  // ==========================================
  // NUEVO PEDIDO
  // ==========================================

  if (
    tipo === "PEDIDO"
  ) {

    tipoActual =
      "PEDIDO";


    document
      .getElementById(
        "seccionFormulario"
      )
      .classList.add(
        "activa"
      );


    document
      .getElementById(
        "menuNuevoPedido"
      )
      .classList.add(
        "activo"
      );


    document
      .getElementById(
        "tipoActual"
      )
      .textContent =
        "🛒 Registrando PEDIDO";


    document
      .getElementById(
        "btnRegistrar"
      )
      .textContent =
        "🛒 REGISTRAR PEDIDO";


    document
      .getElementById(
        "observacion"
      )
      .placeholder =
        "Ejemplo: Pedido semanal";


    ocultarEstado();

    return;

  }


  // ==========================================
  // PEDIDOS
  // ==========================================

  if (
    tipo === "PEDIDOS"
  ) {

    document
      .getElementById(
        "seccionPedidos"
      )
      .classList.add(
        "activa"
      );


    document
      .getElementById(
        "menuPedidos"
      )
      .classList.add(
        "activo"
      );


    cargarPedidos();

    return;

  }


  // ==========================================

// =====================================================
// RECIBIR PEDIDO
// =====================================================

async function recibirPedido(
  pedidoId,
  idSeguro,
  pendienteMaximo
) {

  const input =
    document.getElementById(
      "recibir_" +
      idSeguro
    );


  if (!input) {

    return;

  }


  const cantidad =
    Number(
      input.value
    );


  if (
    !cantidad ||
    cantidad <= 0
  ) {

    alert(
      "Ingrese una cantidad válida."
    );

    return;

  }


  if (
    cantidad >
    pendienteMaximo
  ) {

    alert(
      "Solo quedan " +
      pendienteMaximo +
      " unidades pendientes."
    );

    return;

  }


  const datos = {

    accion:
      "RECIBIR_PEDIDO",

    idOperacion:
      generarIdOperacion(),

    pedidoId:
      pedidoId,

    cantidad:
      cantidad,

    fecha:
      new Date()
        .toLocaleString()

  };


  // ==========================================
  // OFFLINE
  // ==========================================

  if (
    !navigator.onLine
  ) {

    guardarPendiente(
      datos
    );


    aplicarRecepcionLocal(
      pedidoId,
      cantidad
    );


    alert(
      "📴 Recepción guardada. Se sincronizará cuando vuelva Internet."
    );


    return;

  }


  // ==========================================
  // ONLINE
  // ==========================================

  try {

    await fetch(
      INVENTARIO_URL,
      {

        method:
          "POST",

        mode:
          "no-cors",

        body:
          JSON.stringify(
            datos
          )

      }
    );


    input.value =
      "";


    await esperar(
      1000
    );


    cargarPedidos();

    cargarInventario();

    cargarMovimientos();


  }

  catch (error) {

    console.error(
      error
    );


    guardarPendiente(
      datos
    );


    aplicarRecepcionLocal(
      pedidoId,
      cantidad
    );


    alert(
      "No se pudo enviar. La recepción quedó pendiente."
    );

  }

}



// =====================================================
// ACTUALIZAR PEDIDO LOCAL OFFLINE
// =====================================================

function aplicarRecepcionLocal(
  pedidoId,
  cantidad
) {

  const pedidos =
    leerLocal(
      "inventario_ultimos_pedidos",
      []
    );


  const pedido =
    pedidos.find(
      function(item) {

        return (
          String(item.id) ===
          String(pedidoId)
        );

      }
    );


  if (!pedido) {

    return;

  }


  pedido.recibido =
    Number(
      pedido.recibido || 0
    ) +
    cantidad;


  pedido.pendiente =
    Math.max(
      Number(
        pedido.cantidad || 0
      ) -
      pedido.recibido,
      0
    );


  if (
    pedido.pendiente <= 0
  ) {

    pedido.estado =
      "RECIBIDO";

  }

  else if (
    pedido.recibido > 0
  ) {

    pedido.estado =
      "PARCIAL";

  }


  guardarLocal(
    "inventario_ultimos_pedidos",
    pedidos
  );


  pedidosDatos =
    pedidos;


  mostrarPedidos(
    pedidosDatos
  );

}

async function registrar() {

  const material =
    document
      .getElementById(
        "material"
      )
      .value;


  const cantidad =
    Number(
      document
        .getElementById(
          "cantidad"
        )
        .value
    );


  const observacion =
    document
      .getElementById(
        "observacion"
      )
      .value
      .trim();


  if (!material) {

    mostrarEstado(
      "⚠️ Seleccione un material",
      "error"
    );

    return;

  }


  if (
    !cantidad ||
    cantidad <= 0
  ) {

    mostrarEstado(
      "⚠️ Ingrese una cantidad válida",
      "error"
    );

    return;

  }


  const datos = {

    idOperacion:
      generarIdOperacion(),

    accion:
      tipoActual,

    fecha:
      new Date()
        .toLocaleString(),

    material:
      material,

    cantidad:
      cantidad,

    observacion:
      observacion

  };


  const boton =
    document.getElementById(
      "btnRegistrar"
    );


  boton.disabled =
    true;


  // ==========================================
  // OFFLINE
  // ==========================================

  if (
    !navigator.onLine
  ) {

    guardarPendiente(
      datos
    );


    mostrarEstado(
      "📴 Registro guardado. Se sincronizará automáticamente.",
      "correcto"
    );


    limpiarFormulario();


    boton.disabled =
      false;


    return;

  }


  // ==========================================
  // ONLINE
  // ==========================================

  mostrarEstado(
    tipoActual === "PEDIDO"
      ? "⏳ Registrando pedido..."
      : "⏳ Registrando entrada...",
    "cargando"
  );


  try {

    await fetch(
      INVENTARIO_URL,
      {

        method:
          "POST",

        mode:
          "no-cors",

        body:
          JSON.stringify(
            datos
          )

      }
    );


    mostrarEstado(
      tipoActual === "PEDIDO"
        ? "✅ Pedido registrado correctamente"
        : "✅ Entrada registrada correctamente",
      "correcto"
    );


    limpiarFormulario();


    await esperar(
      1000
    );


    if (
      tipoActual === "PEDIDO"
    ) {

      cargarPedidos();

    }

    else {

      cargarInventario();

      cargarMovimientos();

    }


  }

  catch (error) {

    console.error(
      error
    );


    guardarPendiente(
      datos
    );


    mostrarEstado(
      "📴 No fue posible enviar. Registro guardado como pendiente.",
      "correcto"
    );

  }


  boton.disabled =
    false;

}

function guardarLocal(
  clave,
  valor
) {

  try {

    localStorage.setItem(
      clave,
      JSON.stringify(
        valor
      )
    );

  }

  catch (error) {

    console.error(
      error
    );

  }

}



function leerLocal(
  clave,
  defecto
) {

  try {

    return JSON.parse(
      localStorage.getItem(
        clave
      ) ||
      JSON.stringify(
        defecto
      )
    );

  }

  catch (error) {

    return defecto;

  }

}



// =====================================================
// SEGURIDAD DE TEXTO HTML
// =====================================================

function escaparHTML(
  texto
) {

  return String(
    texto ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}



function escaparJS(
  texto
) {

  return String(
    texto ?? ""
  )
  .replace(
    /\\/g,
    "\\\\"
  )
  .replace(
    /'/g,
    "\\'"
  );

}



function safeId(
  texto
) {

  return String(
    texto || ""
  )
  .replace(
    /[^a-zA-Z0-9_-]/g,
    "_"
  );

}
